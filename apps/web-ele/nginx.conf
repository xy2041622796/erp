        location / {
            proxy_pass https://spark.lingmacn.com;
            proxy_set_header Host spark.lingmacn.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_server_name on;
            proxy_redirect off;
        }
    }

    # 443 erp官网站点
    server {
        listen 443 ssl;
        http2 on;
        server_name erp.lingmacn.com;

        # 建议替换为 fullchain 文件（如证书颁发方提供）
		ssl_certificate     /etc/nginx/ssl/lingmacn.com.pem;
		ssl_certificate_key /etc/nginx/ssl/lingmacn.com.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols TLSv1.2 TLSv1.3;     # 仅启用 1.2/1.3
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        # 如需 HSTS，请在确认无误后开启
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 设置官网默认目录及页面
        root /saas/erp/website/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            # 继承跨域设置
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            # Vue静态资源缓存策略
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|ttc|map)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
                try_files $uri =404;
            }
        }
    }

    # 443 租户erp应用站点
    server {
        listen 443 ssl;
        http2 on;
        server_name *.erp.lingmacn.com;
        #server_name ~^[^.]{7,}\.lingmacn\.com$;

        # 建议替换为 fullchain 文件（如证书颁发方提供）



    ssl_certificate     /etc/nginx/ssl/lingmacn.com.pem;
		ssl_certificate_key /etc/nginx/ssl/lingmacn.com.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols TLSv1.2 TLSv1.3;     # 仅启用 1.2/1.3
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        # 如需 HSTS，请在确认无误后开启
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 设置官网默认目录及页面
        root /saas/erp/webapp/;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # --- 核心配置：处理根路径请求 ---
        location = / {
            # 1. 定义一个变量来存储目标路径
            # 这里的字符串是直接拼接的，Nginx 不会对变量内容进行 URL 解码
            # 注意：直接使用原始的 % 编码，不要转义
            set $target "/auth/login?redirect=%252Ferp%252Fworkbench";

            # 2. 使用 try_files 进行内部重写
            # @proxy_to_login 是一个命名位置（Named Location）
            try_files $uri $uri/ @proxy_to_login;
        }

        # 3. 定义命名位置
        # 这里才是真正执行跳转的地方
        location @proxy_to_login {
            # 使用 rewrite 指令配合变量
            # last 标志表示内部重写，并停止处理当前 location，查找新的 location
            rewrite ^ $target last;
        }

        location / {
            try_files $uri $uri/ /index.html;

            # 继承跨域设置
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            # Vue静态资源缓存策略
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|ttc|map)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
                try_files $uri =404;
            }
        }
    }
}
