        # /data/work/vue 目录的Vue应用配置
        location /dist {
            alias /etc/nginx/html/adminnet/wwwroot/qyapiCoreFront/dist/;  # 指向Vue打包文件存放目录

            # 支持Vue History模式路由
            try_files $uri $uri/ /etc/nginx/html/adminnet/wwwroot/qyapiCoreFront/dist/index.html;

            # 继承跨域设置
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
