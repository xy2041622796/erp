            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|ttc|map)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
                try_files $uri =404;
            }
        }

        # /data/work 静态资源（CORS + 预检）
        location /data/work {
            alias /etc/nginx/html;

            # 预检放行
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # 允许跨域访问
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            # 图片文件处理
            location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
                try_files $uri =404;
                expires 30d;
                access_log off;
                add_header Cache-Control "public, max-age=2592000";
            }
        }

        location ~* .html?$ {
			root /etc/nginx/html/adminnet/wwwroot/qyapiCoreFront;
			add_header Cache-Control "no-cache" always; # 排障期
			add_header Pragma "no-cache" always;
			etag off;
			add_header Last-Modified "" always;

            # 对/dist目录下的请求应用特殊规则
            location ~* /dist/.*\.html?$ {
                # 明确指定/dist目录的根路径（与上层root保持一致，可省略）
                # root /etc/nginx/html/adminnet/wwwroot/qyapiCoreFront;

                # 当/dist目录下的资源不存在时，指向/dist/index.html
                try_files $uri $uri/ /dist/index.html;
            }

            # 非/dist目录的HTML请求使用原有规则
			try_files $uri /index.html;
		}

        # 静态资源正则
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|ttc|map)$ {
