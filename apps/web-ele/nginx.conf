user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# 错误日志
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 4096;  # 每个 worker 进程的最大连接数
    multi_accept on;          # 启用多连接接受
    use epoll;                # 使用高效的 epoll 模型（Linux）
}

# HTTP 配置
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式优化
    log_format upstreamlog escape=json '{"remoteaddr": "$remote_addr",'
                                       '"remotetime": "$time_iso8601",'
                                       '"requestaddr": "$request",'
                                       '"requesttimesp": "$request_time",'
                                       '"upstreamaddr": "$upstream_addr"}';
    log_format main_ext escape=json	'{"remoteaddr":"$remote_addr",' '"remotetime":"$time_iso8601",'
								'"scheme":"$scheme",' '"host":"$host",'
								'"req":"$request",' '"status":$status,'
								'"bytes":$body_bytes_sent,' '"referer":"$http_referer",'
								'"ua":"$http_user_agent",' '"rt":$request_time,'
								'"urt":"$upstream_response_time",' '"ups":"$upstream_addr",'
								'"ups_status":"$upstream_status",' '"proto":"$server_protocol",'
								'"client_port":"$remote_port",' '"server_ip":"$server_addr"}';

    access_log /var/log/nginx/access.log upstreamlog;
    access_log /var/log/nginx/access_ext.log main_ext;
    # 文件传输优化
    sendfile on;                    # 启用 sendfile
    tcp_nopush on;                  # 减少网络分片，优化文件传输
    tcp_nodelay on;                 # 减少延迟
    sendfile_max_chunk 512k;        # 设置每次传输的最大数据块大小

    # 长连接超时时间
    keepalive_timeout 65;

    # Gzip 压缩优化
    gzip on;
    gzip_min_length 1024;           # 仅压缩大于 1KB 的文件
    gzip_comp_level 5;              # 设置为 5，平衡性能和压缩率
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_buffers 16 8k;             # Gzip 缓冲区
    gzip_http_version 1.1;          # 使用 HTTP/1.1
    gzip_proxied any;               # 允许代理请求启用 Gzip
    gzip_vary on;                   # 为不同的用户代理生成不同的压缩文件

    # 缓冲区优化
    client_body_buffer_size 128k;   # 设置客户端请求缓冲区大小
    client_max_body_size 100m;      # 设置最大请求体大小
    proxy_buffer_size 16k;          # 设置代理缓冲区大小
    proxy_buffers 4 32k;            # 设置代理缓冲区数量和大小
    proxy_busy_buffers_size 64k;    # 设置繁忙代理缓冲区大小

    # 代理超时设置
    proxy_connect_timeout 10s;      # 连接超时时间
    proxy_read_timeout 300s;        # 读取超时时间
    proxy_send_timeout 30s;         # 发送超时时间

    # 包含其他配置文件
    include /etc/nginx/conf.d/*.conf;

    # 80 裸域跳转到 www
    server {
        listen 80;
        server_name lingmacn.com;

        location / {
            # 替换为实际目标地址（例如https://internal-service.com）
            rewrite ^/(.*)$ https://www.lingmacn.com/$1 permanent;
        }
    }

    # 80 www 站点
    server {
        listen 80;
        server_name www.lingmacn.com;

        #默认跳转官方网站
        location / {
            # 替换为实际目标地址（例如https://internal-service.com）
            rewrite ^/(.*)$ https://www.lingmacn.com/$1 permanent;
        }
    }

    # 443 裸域跳转到 www
    server {
        listen 443 ssl;
        server_name lingmacn.com;

        # 建议替换为 fullchain 文件（如证书颁发方提供）
		ssl_certificate     /etc/nginx/ssl/lingmacn.com.pem;
		ssl_certificate_key /etc/nginx/ssl/lingmacn.com.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols TLSv1.2 TLSv1.3;     # 仅启用 1.2/1.3
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # 替换为实际目标地址（例如https://internal-service.com）
            rewrite ^/(.*)$ https://www.lingmacn.com/$1 permanent;
        }
    }

    # 443 www 官网站点
    server {
        listen 443 ssl;
        http2 on;
        server_name www.lingmacn.com;

        # 建议替换为 fullchain 文件（如证书颁发方提供）
		ssl_certificate     /etc/nginx/ssl/lingmacn.com.pem;
		ssl_certificate_key /etc/nginx/ssl/lingmacn.com.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols TLSv1.2 TLSv1.3;     # 仅启用 1.2/1.3
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        # 如需 HSTS，请在确认无误后开启
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 设置官网默认目录及页面
        root /etc/nginx/html/adminnet/dist/;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            # 继承跨域设置
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            # Vue静态资源缓存策略
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|ttc|map)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
                try_files $uri =404;
            }
        }

        # WebSocket（仅此处设置升级头）
        location /api/websocket {
            proxy_pass http://172.16.67.246:38080/api/websocket;
            proxy_pass_request_headers on;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 拦截 swagger 整个前端目录请求并去掉 /api 前缀
        location ~ ^/api/(swagger-ui|v3|doc\.html) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://172.16.67.246:34328;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 代理
        location /api {
            proxy_pass http://172.16.67.246:38080/api;
            proxy_pass_request_headers on;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Custom-Header $http_custom_header;
            proxy_set_header Authorization $http_authorization;
        }
    }

    # 443 demo www 试用站点（API 与静态）
