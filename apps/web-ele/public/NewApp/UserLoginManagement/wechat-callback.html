<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微信登录回调</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #334155;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <span id="message">微信登录处理中...</span>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || '');
        var code = params.get('code') || '';
        var state = params.get('state') || '';
        var ent = params.get('ent') || '';
        var loginType = params.get('type') || 'WECHAT_WEB';
        var appOrigin = params.get('app_origin') || '*';
        var messageEl = document.getElementById('message');

        var result = code
          ? {
              type: 'code',
              code: code,
              state: state,
              ent: ent,
              loginType: loginType,
            }
          : {
              type: 'error',
              state: state,
              ent: ent,
              loginType: loginType,
              message: '未获取到扫码 code',
            };

        function safePostMessage(targetOrigin) {
          if (!window.parent || window.parent === window) return;
          window.parent.postMessage(
            {
              from: 'WECHAT_CALLBACK',
              result: result,
            },
            targetOrigin,
          );
        }

        function postOnce() {
          try {
            safePostMessage(appOrigin);
          } catch (error) {
            safePostMessage('*');
          }
        }

        if (!code) {
          messageEl.textContent = '微信登录失败：未获取到扫码 code';
        } else {
          messageEl.textContent = '微信登录处理中，请稍候...';
        }

        postOnce();
        setTimeout(postOnce, 200);
        setTimeout(postOnce, 800);
        setTimeout(postOnce, 1500);
      })();
    </script>
  </body>
</html>
